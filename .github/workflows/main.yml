name: RPI5-PKG SDK K6.12 (ImmortalWrt)

on:
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Install Deps
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gettext git \
            libncurses5-dev libssl-dev python3 python3-setuptools rsync swig unzip \
            zlib1g-dev file wget curl ccache libelf-dev python3-pyelftools zstd

      - name: Download SDK (Kernel 6.12)
        run: |
          wget https://downloads.immortalwrt.org/releases/25.12.0-rc1/targets/bcm27xx/bcm2712/immortalwrt-sdk-25.12.0-rc1-bcm27xx-bcm2712_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar --zstd -xf immortalwrt-sdk-25.12.0-rc1-bcm27xx-bcm2712_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: Verify SHA256 (optional but good)
        run: |
          echo "379426625c28ebb6f4023667ad9fb61f5a1120e04f9098ef2f9d1a5d0da6cb36  sdk.tar.zst" > check.txt || true

      - name: Add RPI5-PKG
        run: |
          cd sdk
          git clone --depth=1 -b packages https://github.com/AW1Kdev/RPI5-PKG.git package/rpi5-pkg

      - name: Update Feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Enable ALL Packages
        run: |
          cd sdk

          find package/rpi5-pkg -name Makefile | while read f; do
            PKG=$(grep -m1 '^PKG_NAME:=' "$f" | cut -d= -f2 | tr -d ' ')
            [ -n "$PKG" ] && echo CONFIG_PACKAGE_$PKG=y >> .config
          done

          sort -u .config -o .config
          make defconfig

          echo "===== ENABLED PACKAGES ====="
          grep CONFIG_PACKAGE_ .config || true

      - name: Download Sources
        run: |
          cd sdk
          make download -j$(nproc) || make download -j1 V=s

      - name: Build ALL Apps
        run: |
          cd sdk
          make package/rpi5-pkg/compile -j$(nproc) || make package/rpi5-pkg/compile -j1 V=s

      - name: Collect IPK
        if: always()
        run: |
          mkdir -p artifact/ipk artifact/logs

          cp -rf sdk/bin/packages/*/*/*.ipk artifact/ipk/ 2>/dev/null || true
          cp -rf sdk/logs/* artifact/logs/ 2>/dev/null || true

          echo "===== BUILT FILES ====="
          find artifact -type f

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RPI5-PKG-K6.12-IPK
          path: artifact/
