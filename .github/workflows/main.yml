name: RPI5-PKG SDK K6.12 FULL

on:
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ===============================
      # Clean runner
      # ===============================
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      # ===============================
      # Install deps
      # ===============================
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses5-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl ccache \
            libelf-dev python3-pyelftools zstd

      # ===============================
      # Download SDK (KERNEL 6.12)
      # ===============================
      - name: Download SDK
        run: |
          wget https://downloads.immortalwrt.org/releases/25.12.0-rc1/targets/bcm27xx/bcm2712/immortalwrt-sdk-25.12.0-rc1-bcm27xx-bcm2712_gcc-14.3.0_musl.Linux-x86_64.tar.zst

      # ===============================
      # Extract SDK (FIXED)
      # ===============================
      - name: Extract SDK
        run: |
          tar --zstd -xf immortalwrt-sdk-25.12.0-rc1-bcm27xx-bcm2712_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          mv immortalwrt-sdk-25.12.0-rc1-bcm27xx-bcm2712_gcc-14.3.0_musl.Linux-x86_64 sdk
          ls -lah

      # ===============================
      # Clone your packages
      # ===============================
      - name: Add RPI5-PKG
        run: |
          cd sdk
          git clone --depth=1 -b packages https://github.com/AW1Kdev/RPI5-PKG.git package/rpi5-pkg

      # ===============================
      # Feeds
      # ===============================
      - name: Update Feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ===============================
      # Enable ALL packages
      # ===============================
      - name: Enable All Packages
        run: |
          cd sdk

          echo "===== SCAN PACKAGE ====="

          find package/rpi5-pkg -name Makefile | while read f; do
            PKG=$(grep -m1 '^PKG_NAME:=' "$f" | cut -d= -f2 | tr -d ' ')
            if [ -n "$PKG" ]; then
              echo CONFIG_PACKAGE_$PKG=y >> .config
              echo "ADD -> $PKG"
            fi
          done

          sort -u .config -o .config
          make defconfig

          echo "===== ENABLED ====="
          grep CONFIG_PACKAGE_ .config || true

      # ===============================
      # Download sources
      # ===============================
      - name: Download Sources
        run: |
          cd sdk
          make download -j$(nproc) || make download -j1 V=s

      # ===============================
      # Build ALL (skip error)
      # ===============================
      - name: Build Packages (AUTO SKIP ERROR)
        run: |
          cd sdk

          echo "===== START BUILD ====="

          for dir in $(find package/rpi5-pkg -mindepth 1 -maxdepth 1 -type d); do
            echo ">>> BUILD $dir"

            make package/$(basename $dir)/compile -j$(nproc) || {
              echo "❌ FAIL $dir (skip)"
            }
          done

      # ===============================
      # Collect IPK
      # ===============================
      - name: Collect Artifacts
        if: always()
        run: |
          mkdir -p artifact/ipk artifact/logs artifact/config

          cp -rf sdk/bin/packages/*/*/*.ipk artifact/ipk/ 2>/dev/null || true
          cp -rf sdk/logs/* artifact/logs/ 2>/dev/null || true
          cp sdk/.config artifact/config/config.buildinfo 2>/dev/null || true

          echo "===== RESULT ====="
          find artifact -type f

      # ===============================
      # Upload
      # ===============================
      - name: Upload IPK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RPI5-PKG-K6.12-IPK
          path: artifact/
